version: '3.8'

services:
  # ЯДРО
  ollama:
    image: ollama/ollama:latest
    container_name: niias-ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    networks:
      - niias-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niias-backend
    # Убрали volume lancedb_data
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - niias-network

  #  ИНТЕРФЕЙС
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: niias-frontend
    restart: unless-stopped
    networks:
      - niias-network

  nginx-proxy:
    image: nginx:alpine
    container_name: niias-nginx
    ports:
      - "80:80" # Единственный порт, открытый наружу
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - niias-network

networks:
  niias-network:
    driver: bridge

volumes:
  ollama_models: